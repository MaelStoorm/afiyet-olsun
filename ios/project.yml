# AfiyetOlsun iOS projesi. Xcode projesi bu dosyadan XcodeGen ile üretilir (GitHub Actions'ta).
# Ortak kabuk: ios/Shell. Uygulamanın kendisi Android'deki ile aynı sayfa; ios/hazirla.sh site klasörünü hazırlar.
name: AfiyetOlsun
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  AfiyetOlsun:
    type: application
    platform: iOS
    sources:
      - path: Shell
      - path: AfiyetOlsun/Assets.xcassets
      - path: gen/AfiyetOlsun/site
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.afiyetolsun.oyun
        PRODUCT_NAME: AfiyetOlsun
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SHELL_NO_LOCATION
        INFOPLIST_FILE: AfiyetOlsun/Info.plist
    info:
      path: AfiyetOlsun/Info.plist
      properties: {"CFBundleDisplayName": "Afiyet Olsun", "CFBundleShortVersionString": "$(MARKETING_VERSION)", "CFBundleVersion": "$(CURRENT_PROJECT_VERSION)", "CFBundleDevelopmentRegion": "tr", "LSRequiresIPhoneOS": true, "ITSAppUsesNonExemptEncryption": false, "UIRequiresFullScreen": true, "UIStatusBarStyle": "UIStatusBarStyleLightContent", "UIViewControllerBasedStatusBarAppearance": true, "UISupportedInterfaceOrientations": ["UIInterfaceOrientationLandscapeLeft", "UIInterfaceOrientationLandscapeRight"], "UILaunchScreen": {"UIColorName": "LaunchBg"}, "UIApplicationSceneManifest": {"UIApplicationSupportsMultipleScenes": false, "UISceneConfigurations": {"UIWindowSceneSessionRoleApplication": [{"UISceneConfigurationName": "Default", "UISceneDelegateClassName": "$(PRODUCT_MODULE_NAME).SceneDelegate"}]}}, "Shell": {"Background": "#D6442A", "LightStatusBar": true, "Orientation": "landscape", "FitHeight": 430}}
